<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>1990.04.29</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#ffffff;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* 52行刚好塞进窗口 */
:root{
    --cell-size: calc((100vh - 80px) / 52);
}

.grid{
    display:grid;

    /* 每行90格 */
    grid-template-columns:repeat(90, var(--cell-size));

    gap:1px;
}

.week{
    width:var(--cell-size);
    height:var(--cell-size);

    background:#e8e8e8;

    border-radius:1px;

    transition:transform .15s ease;
}

.week:hover{
    transform:scale(1.8);
    z-index:10;
}

.past{
    background:#000;
}

.current{
    background:#ff0000;
}

</style>
</head>
<body>

<div class="grid" id="grid"></div>

<script>

// 出生日期
const birthday = new Date("1990-04-29");

// 假设寿命90岁
const years = 90;
const weeksPerYear = 52;
const totalWeeks = years * weeksPerYear;

// 当前时间
const now = new Date();

// 已度过周数
const livedWeeks = Math.floor(
    (now - birthday) / (7 * 24 * 60 * 60 * 1000)
);

const grid = document.getElementById("grid");

for(let i = 0; i < totalWeeks; i++){

    const cell = document.createElement("div");

    cell.className = "week";

    if(i < livedWeeks){
        cell.classList.add("past");
    }

    if(i === livedWeeks){
        cell.classList.add("current");
    }

    const weekDate = new Date(
        birthday.getTime() + i * 7 * 24 * 60 * 60 * 1000
    );

    const age = Math.floor(i / 52);
    const weekInYear = (i % 52) + 1;

    cell.title =
        `年龄：${age}岁\n` +
        `第${weekInYear}周\n` +
        weekDate.toLocaleDateString("zh-CN");

    grid.appendChild(cell);
}

</script>

</body>
</html>
